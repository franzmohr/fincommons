# Every change pushed or proposed to main is tested, built and checked for
# licensing on a neutral machine before it is merged; see the handbook's
# section on continuous integration and delivery.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The tests that need no Spark session, on the oldest and the newest Python
  # the package declares. They take seconds and answer first.
  fast:
    name: Tests without Spark (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[local,dev,marketprice]"

      # The Spark session is never built, but tests/conftest.py imports the
      # module that builds it, so PySpark is installed all the same.
      - name: Test
        run: python -m pytest -m "not spark"

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest Python the package declares.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Spark 4 and Delta 4 run on Java 17.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The session the tests share fetches the Delta jars from Maven when it
      # starts; keeping Ivy's cache saves fetching them on every run.
      - uses: actions/cache@v6
        with:
          path: ~/.ivy2
          key: ivy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install
        run: python -m pip install -e ".[local,dev,marketprice]"

      # Every test is named as it runs, so that a slow one is visible as
      # such, and the slowest are listed at the end. Coverage is measured on
      # the newest Python and sent to Codecov, which draws the README badge.
      - name: Test
        run: python -m pytest -v --durations=25 ${{ matrix.python == '3.12' && '--cov=fincommons --cov-report=xml' || '' }}

      - uses: codecov/codecov-action@v5
        if: matrix.python == '3.12'
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  # The lower bounds in pyproject.toml are a promise to a Databricks Runtime
  # that ships older packages than PyPI does. This job holds the package to
  # that promise by installing the oldest version of every direct dependency
  # it declares, and running the whole suite against them.
  minimum-versions:
    name: Tests on the oldest declared dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # The oldest declared PySpark is 3.5, which runs on Java 8, 11 and 17.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v6

      - uses: actions/cache@v6
        with:
          path: ~/.ivy2
          key: ivy-lowest-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      # lowest-direct takes the lower bound of every dependency fincommons
      # declares itself, and leaves their own dependencies to resolve freely.
      # uv pip list is in the log so that a failure names the versions it ran
      # on.
      - name: Install the oldest declared versions
        run: |
          uv venv --python 3.10
          uv pip install --resolution lowest-direct -e ".[local,dev,marketprice]"
          uv pip list

      - name: Test
        run: .venv/bin/python -m pytest -v --durations=25

  build:
    name: Build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*

  licensing:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
