# The data contract of the entities table of the Silver layer of fincommons.gleif,
# in the Open Data Contract Standard. It is the single source of truth for
# what the columns of the table mean: fincommons.columns reads its
# descriptions from here, and the test suite holds it against the code and
# against the table the module writes. See fincommons.contracts.
#
# A shipped contract is a template: it states nothing that belongs to a
# deployment. Where the table lives is stated by the configuration file.
apiVersion: v3.2.0
kind: DataContract
id: fincommons.gleif.silver.entities
name: entities
version: 1.0.0
status: active
domain: gleif
dataProduct: fincommons.gleif
description:
  purpose: >-
    Who every legal entity identifier belongs to, as it stood on any day since the
    history was begun: the legal name, the addresses, the legal form, the jurisdiction,
    and the status of the entity and of its registration.
  usage: >-
    Read what held on a day with fincommons.gleif.entities_as_of(spark, config,
    day), and the latest state with fincommons.gleif.latest_entities(spark, config).
    Every column GLEIF writes is kept as text, dates included, as the ISO 8601 text
    of the file; parse it where a date is wanted.
  limitations: >-
    39 of the some 340 columns of the golden copy are kept: every further other
    name and address line is left out. A history begun on a day holds each record
    as it was then, from its last update before that; what it was before that is
    not known. A version begins on the day of the record's last update, and a history
    fed by monthly full copies loses the intermediate states of a record that changed
    more than once within the month. The day of the last update and the conformity
    flag do not open a version.
authoritativeDefinitions:
- type: implementation
  url: >-
    https://github.com/franzmohr/fincommons/blob/main/src/fincommons/gleif/silver.py
- type: businessDefinition
  url: https://goldencopy.gleif.org/api/v2/golden-copies/publishes
  description: >-
    The list of the publications of the golden copy and its delta files, from which
    the history is read.
