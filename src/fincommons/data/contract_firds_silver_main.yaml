# The data contract of the main table of the Silver layer of
# fincommons.firds, in the Open Data Contract Standard. It is the single
# source of truth for what the columns of the table mean: fincommons.columns
# reads its descriptions from here, and the test suite holds it against the
# code and against the table the module writes. See fincommons.contracts.
#
# A shipped contract is a template: it states nothing that belongs to a
# deployment. Where the table lives is stated by the configuration file.
apiVersion: v3.2.0
kind: DataContract
id: fincommons.firds.silver.main
name: main
version: 1.0.0
status: active
domain: firds
dataProduct: fincommons.firds
description:
  purpose: >-
    The reference data ESMA publishes for every financial instrument admitted to
    trading on an EU trading venue, as it stood on any day since the history was
    begun, so that a transaction or a holding can be described as of its own date.
  usage: >-
    Read what held on a day with valid_from <= day and (valid_to IS NULL OR valid_to
    >= day), and the latest state with latest_record. fincommons.firds.connect_to_firds(spark,
    config, 'main') opens the table.
  limitations: >-
    An instrument is described per venue: the same ISIN has one row per venue it
    trades on, and the venues need not agree. The history begins with the full file
    it was started from; what an instrument was before that is not known. A cancelled
    record stays as the version in force of its instrument and venue.
authoritativeDefinitions:
- type: implementation
  url: >-
    https://github.com/franzmohr/fincommons/blob/main/src/fincommons/firds/silver.py
- type: businessDefinition
  url: https://eur-lex.europa.eu/eli/reg_del/2017/585/oj
  description: >-
    Commission Delegated Regulation (EU) 2017/585 (RTS 23), whose annex defines
    the fields of the reference data.
schema:
- name: main
  physicalType: table
  businessName: FIRDS reference data history
  description: >-
    Every version of the reference data of every financial instrument on every trading
    venue, as section 4.2 of ESMA65-8-5014 builds it from one full file and the
    daily delta files that follow it. A version holds from valid_from to valid_to,
    both inclusive.
  dataGranularityDescription: >-
    One version of the reference data of an instrument on a trading venue: one row
    per ISIN, trading venue and first day of validity.
  properties:
  - name: isin
    businessName: ISIN
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 1
    semanticType: dimension
    description: >-
      Instrument identification code: the ISIN of the financial instrument (RTS
      23 field 1).
    synonyms:
    - synonym: FinInstrmGnlAttrbts.Id
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: identifier
      vendor: fincommons
    - property: source
      value: FinInstrmGnlAttrbts.Id
      vendor: fincommons
  - name: full_name
    businessName: Full name
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: Full name of the financial instrument (RTS 23 field 2).
    synonyms:
    - synonym: FinInstrmGnlAttrbts.FullNm
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: text
      vendor: fincommons
    - property: source
      value: FinInstrmGnlAttrbts.FullNm
      vendor: fincommons
  - name: cfi
    businessName: CFI code
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: >-
      Classification of the instrument as an ISO 10962 cfi code (RTS 23 field 3).
    synonyms:
    - synonym: FinInstrmGnlAttrbts.ClssfctnTp
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: code
      vendor: fincommons
    - property: source
      value: FinInstrmGnlAttrbts.ClssfctnTp
      vendor: fincommons
  - name: commodity_derivative_indicator
    businessName: Commodity derivative
    logicalType: boolean
    physicalType: boolean
    semanticType: dimension
    description: >-
      Commodity derivative indicator: whether the instrument is a commodity derivative
      (RTS 23 field 4).
    synonyms:
    - synonym: FinInstrmGnlAttrbts.CmmdtyDerivInd
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: flag
      vendor: fincommons
    - property: source
      value: FinInstrmGnlAttrbts.CmmdtyDerivInd
      vendor: fincommons
  - name: issuer
    businessName: Issuer LEI
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: >-
      LEI of the issuer, or of the trading venue operator where the instrument has
      no issuer (RTS 23 field 5).
    authoritativeDefinitions:
    - type: businessDefinition
      url: >-
        https://www.gleif.org/en/about-lei/introducing-the-legal-entity-identifier-lei
      description: ISO 17442, the Legal Entity Identifier.
    synonyms:
    - synonym: Issr
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: identifier
      vendor: fincommons
    - property: source
      value: Issr
      vendor: fincommons
  - name: trading_venue
    businessName: Trading venue
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    primaryKeyPosition: 2
    semanticType: dimension
    description: >-
      Trading venue: the MIC of the venue the instrument is admitted to or traded
      on (RTS 23 field 6).
    authoritativeDefinitions:
    - type: businessDefinition
      url: https://www.iso20022.org/market-identifier-codes
      description: ISO 10383, the Market Identifier Code.
    synonyms:
    - synonym: TradgVnRltdAttrbts.Id
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: code
      vendor: fincommons
    - property: source
      value: TradgVnRltdAttrbts.Id
      vendor: fincommons
  - name: short_name
    businessName: Short name (FISN)
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: Short name of the instrument, the ISO 18774 FISN (RTS 23 field
      7).
    synonyms:
    - synonym: FinInstrmGnlAttrbts.ShrtNm
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: text
      vendor: fincommons
    - property: source
      value: FinInstrmGnlAttrbts.ShrtNm
      vendor: fincommons
  - name: issuer_request
    businessName: Requested by the issuer
    logicalType: boolean
    physicalType: boolean
    semanticType: dimension
    description: >-
      Whether the admission to trading or trading on the venue was requested or
      approved by the issuer (RTS 23 field 8).
    synonyms:
    - synonym: TradgVnRltdAttrbts.IssrReq
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: flag
      vendor: fincommons
    - property: source
      value: TradgVnRltdAttrbts.IssrReq
      vendor: fincommons
  - name: admission_approval_date_by_issuer
    businessName: Admission approved by the issuer
    logicalType: timestamp
    physicalType: timestamp
    semanticType: dimension
    description: >-
      Date and time the issuer approved the admission to trading or trading of its
      instrument on the venue (RTS 23 field 9, date of approval of the admission
      to trading).
    synonyms:
    - synonym: TradgVnRltdAttrbts.AdmssnApprvlDtByIssr
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: datetime
      vendor: fincommons
    - property: source
      value: TradgVnRltdAttrbts.AdmssnApprvlDtByIssr
      vendor: fincommons
  - name: request_for_admission_date
    businessName: Admission requested
    logicalType: timestamp
    physicalType: timestamp
    semanticType: dimension
    description: >-
      Date and time of the request for admission to trading on the venue (RTS 23
      field 10).
    synonyms:
    - synonym: TradgVnRltdAttrbts.ReqForAdmssnDt
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: datetime
      vendor: fincommons
    - property: source
      value: TradgVnRltdAttrbts.ReqForAdmssnDt
      vendor: fincommons
  - name: first_trade_date
    businessName: First trade
    logicalType: timestamp
    physicalType: timestamp
    semanticType: dimension
    description: >-
      Date and time of admission to trading or of the first trade on the venue (RTS
      23 field 11).
    synonyms:
    - synonym: TradgVnRltdAttrbts.FrstTradDt
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: datetime
      vendor: fincommons
    - property: source
      value: TradgVnRltdAttrbts.FrstTradDt
      vendor: fincommons
  - name: termination_date
    businessName: Termination
    logicalType: timestamp
    physicalType: timestamp
    semanticType: dimension
    description: >-
      Termination date: date and time the instrument ceases to be traded or admitted
      to trading on the venue (RTS 23 field 12).
    synonyms:
    - synonym: TradgVnRltdAttrbts.TermntnDt
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: datetime
      vendor: fincommons
    - property: source
      value: TradgVnRltdAttrbts.TermntnDt
      vendor: fincommons
  - name: notional_currency
    businessName: Notional currency
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: >-
      Notional currency of the instrument (RTS 23 field 13, notional currency 1),
      ISO 4217.
    authoritativeDefinitions:
    - &id001
      type: businessDefinition
      url: https://www.iso.org/iso-4217-currency-codes.html
    synonyms:
    - synonym: FinInstrmGnlAttrbts.NtnlCcy
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: currency
      vendor: fincommons
    - property: source
      value: FinInstrmGnlAttrbts.NtnlCcy
      vendor: fincommons
  - name: total_issued_nominal_amount
    businessName: Total issued nominal amount
    logicalType: number
    physicalType: decimal(23,5)
    semanticType: measure
    transformLogic: AVG(total_issued_nominal_amount)
    description: Total issued nominal amount of a debt instrument (RTS 23 field
      14).
    synonyms:
    - synonym: DebtInstrmAttrbts.TtlIssdNmnlAmt._VALUE
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: amount
      vendor: fincommons
    - property: source
      value: DebtInstrmAttrbts.TtlIssdNmnlAmt._VALUE
      vendor: fincommons
    - property: aggregation
      value: nonAdditive
      vendor: fincommons
      description: >-
        The issue is the instrument's, and every venue and every version of it repeats
        the amount: summed over the rows of the table it is counted once per venue
        and version. Sum it over distinct ISINs, one version each, and only in one
        currency.
    - property: aggregateWithin
      value:
      - isin
      vendor: fincommons
    - property: currencyProperty
      value: total_issued_nominal_currency
      vendor: fincommons
  - name: total_issued_nominal_currency
    businessName: Currency of the total issued nominal amount
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: >-
      Currency of the total issued nominal amount of a debt instrument (ISO 4217;
      RTS 23 field 16, currency of nominal value).
    authoritativeDefinitions:
    - *id001
    synonyms:
    - synonym: DebtInstrmAttrbts.TtlIssdNmnlAmt._Ccy
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: currency
      vendor: fincommons
    - property: source
      value: DebtInstrmAttrbts.TtlIssdNmnlAmt._Ccy
      vendor: fincommons
  - name: maturity_date
    businessName: Maturity date
    logicalType: date
    physicalType: date
    semanticType: dimension
    description: Maturity date of a debt instrument (RTS 23 field 15).
    synonyms:
    - synonym: DebtInstrmAttrbts.MtrtyDt
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: date
      vendor: fincommons
    - property: source
      value: DebtInstrmAttrbts.MtrtyDt
      vendor: fincommons
  - name: nominal_value_per_unit_amount
    businessName: Nominal value per unit
    logicalType: number
    physicalType: decimal(23,5)
    semanticType: measure
    transformLogic: AVG(nominal_value_per_unit_amount)
    description: >-
      Nominal value per unit, or minimum traded value, of a debt instrument (RTS
      23 field 17).
    synonyms:
    - synonym: DebtInstrmAttrbts.NmnlValPerUnit._VALUE
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: amount
      vendor: fincommons
    - property: source
      value: DebtInstrmAttrbts.NmnlValPerUnit._VALUE
      vendor: fincommons
    - property: aggregation
      value: nonAdditive
      vendor: fincommons
      description: A value per unit, which is never summed.
    - property: aggregateWithin
      value:
      - isin
      vendor: fincommons
    - property: currencyProperty
      value: nominal_value_per_unit_currency
      vendor: fincommons
  - name: nominal_value_per_unit_currency
    businessName: Currency of the nominal value per unit
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: >-
      Currency of the nominal value per unit of a debt instrument (ISO 4217).
    authoritativeDefinitions:
    - *id001
    synonyms:
    - synonym: DebtInstrmAttrbts.NmnlValPerUnit._Ccy
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: currency
      vendor: fincommons
    - property: source
      value: DebtInstrmAttrbts.NmnlValPerUnit._Ccy
      vendor: fincommons
  - name: interest_rate_fixed
    businessName: Fixed interest rate
    logicalType: number
    physicalType: decimal(21,10)
    semanticType: measure
    transformLogic: AVG(interest_rate_fixed)
    description: >-
      Fixed interest (coupon) rate of a debt instrument, in percent (RTS 23 field
      18).
    synonyms:
    - synonym: DebtInstrmAttrbts.IntrstRate.Fxd
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: rate
      vendor: fincommons
    - property: source
      value: DebtInstrmAttrbts.IntrstRate.Fxd
      vendor: fincommons
    - property: aggregation
      value: nonAdditive
      vendor: fincommons
      description: A rate, which is never summed and is averaged only for one instrument.
    - property: aggregateWithin
      value:
      - isin
      vendor: fincommons
  - name: interest_rate_floating_id_type
    businessName: Kind of reference rate identifier
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: >-
      How the reference rate of a floating rate debt instrument is identified in
      interest_rate_floating_id: ISIN, Index (index code) or Name; derived from
      which of the three elements is filled.
    synonyms:
    - synonym: DebtInstrmAttrbts.IntrstRate.Fltg.RefRate.ISIN
      source: ESMA FIRDS
    - synonym: DebtInstrmAttrbts.IntrstRate.Fltg.RefRate.Indx
      source: ESMA FIRDS
    - synonym: DebtInstrmAttrbts.IntrstRate.Fltg.RefRate.Nm
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: code
      vendor: fincommons
    - property: source
      value: >-
        DebtInstrmAttrbts.IntrstRate.Fltg.RefRate.ISIN | DebtInstrmAttrbts.IntrstRate.Fltg.RefRate.Indx
        | DebtInstrmAttrbts.IntrstRate.Fltg.RefRate.Nm
      vendor: fincommons
  - name: interest_rate_floating_id
    businessName: Reference rate
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: >-
      Identifier of the reference rate (index or benchmark) of a floating rate debt
      instrument: its ISIN, index code or name, according to interest_rate_floating_id_type
      (RTS 23 fields 19 and 20).
    synonyms:
    - synonym: DebtInstrmAttrbts.IntrstRate.Fltg.RefRate.ISIN
      source: ESMA FIRDS
    - synonym: DebtInstrmAttrbts.IntrstRate.Fltg.RefRate.Indx
      source: ESMA FIRDS
    - synonym: DebtInstrmAttrbts.IntrstRate.Fltg.RefRate.Nm
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: identifier
      vendor: fincommons
    - property: source
      value: >-
        DebtInstrmAttrbts.IntrstRate.Fltg.RefRate.ISIN | DebtInstrmAttrbts.IntrstRate.Fltg.RefRate.Indx
        | DebtInstrmAttrbts.IntrstRate.Fltg.RefRate.Nm
      vendor: fincommons
  - name: interest_rate_floating_term_value
    businessName: Term of the reference rate
    logicalType: integer
    physicalType: bigint
    semanticType: dimension
    description: >-
      Number of units of the term of the floating reference rate (RTS 23 field 21),
      e.g. 3 for a three-month rate.
    synonyms:
    - synonym: DebtInstrmAttrbts.IntrstRate.Fltg.Term.Val
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: quantity
      vendor: fincommons
    - property: source
      value: DebtInstrmAttrbts.IntrstRate.Fltg.Term.Val
      vendor: fincommons
  - name: interest_rate_floating_term_unit
    businessName: Unit of the term of the reference rate
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: >-
      Unit of the term of the floating reference rate (RTS 23 field 21): DAYS, WEEK,
      MNTH or YEAR.
    synonyms:
    - synonym: DebtInstrmAttrbts.IntrstRate.Fltg.Term.Unit
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: code
      vendor: fincommons
    - property: source
      value: DebtInstrmAttrbts.IntrstRate.Fltg.Term.Unit
      vendor: fincommons
  - name: interest_rate_floating_spread
    businessName: Spread over the reference rate
    logicalType: integer
    physicalType: bigint
    semanticType: measure
    transformLogic: AVG(interest_rate_floating_spread)
    description: >-
      Spread in basis points over the reference rate of a floating rate debt instrument
      (RTS 23 field 22).
    synonyms:
    - synonym: DebtInstrmAttrbts.IntrstRate.Fltg.BsisPtSprd
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: rate
      vendor: fincommons
    - property: source
      value: DebtInstrmAttrbts.IntrstRate.Fltg.BsisPtSprd
      vendor: fincommons
    - property: aggregation
      value: nonAdditive
      vendor: fincommons
      description: >-
        A spread in basis points, which is never summed and is averaged only for
        one instrument.
    - property: aggregateWithin
      value:
      - isin
      vendor: fincommons
  - name: debt_seniority
    businessName: Debt seniority
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: >-
      Seniority of a debt instrument (RTS 23 field 23): SNDB senior, MZZD mezzanine,
      SBOD subordinated or JUND junior.
    synonyms:
    - synonym: DebtInstrmAttrbts.DebtSnrty
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: code
      vendor: fincommons
    - property: source
      value: DebtInstrmAttrbts.DebtSnrty
      vendor: fincommons
  - name: expiry_date
    businessName: Expiry date
    logicalType: date
    physicalType: date
    semanticType: dimension
    description: Expiry date of a derivative (RTS 23 field 24).
    synonyms:
    - synonym: DerivInstrmAttrbts.XpryDt
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: date
      vendor: fincommons
    - property: source
      value: DerivInstrmAttrbts.XpryDt
      vendor: fincommons
  - name: price_multiplier
    businessName: Price multiplier
    logicalType: number
    physicalType: decimal(35,17)
    semanticType: measure
    transformLogic: AVG(price_multiplier)
    description: >-
      Price multiplier of a derivative: the number of units of the underlying represented
      by one contract (RTS 23 field 25).
    synonyms:
    - synonym: DerivInstrmAttrbts.PricMltplr
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: quantity
      vendor: fincommons
    - property: source
      value: DerivInstrmAttrbts.PricMltplr
      vendor: fincommons
    - property: aggregation
      value: nonAdditive
      vendor: fincommons
      description: A multiplier of the contract, which is never summed.
    - property: aggregateWithin
      value:
      - isin
      vendor: fincommons
  - name: option_type
    businessName: Option type
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: 'Option type (RTS 23 field 30): CALL, PUTO or OTHR.'
    synonyms:
    - synonym: DerivInstrmAttrbts.OptnTp
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: code
      vendor: fincommons
    - property: source
      value: DerivInstrmAttrbts.OptnTp
      vendor: fincommons
  - name: option_exercise_style
    businessName: Option exercise style
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: >-
      Option exercise style (RTS 23 field 33): EURO, AMER, ASIA, BERM or OTHR.
    synonyms:
    - synonym: DerivInstrmAttrbts.OptnExrcStyle
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: code
      vendor: fincommons
    - property: source
      value: DerivInstrmAttrbts.OptnExrcStyle
      vendor: fincommons
  - name: delivery_type
    businessName: Delivery type
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: >-
      Delivery type of a derivative (RTS 23 field 34): PHYS physical, CASH cash
      or OPTL optional.
    synonyms:
    - synonym: DerivInstrmAttrbts.DlvryTp
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: code
      vendor: fincommons
    - property: source
      value: DerivInstrmAttrbts.DlvryTp
      vendor: fincommons
  - name: tech_publication_period_from_date
    businessName: Publication period from
    logicalType: date
    physicalType: date
    semanticType: dimension
    description: >-
      Technical attribute: start of the record's publication period in FIRDS, from
      whichever branch of the period is stated (FrDt, FrDtToDt.FrDt or Dt), falling
      back to the file's reference date for terminations and cancellations that
      state no period.
    synonyms:
    - synonym: TechAttrbts.PblctnPrd.FrDt
      source: ESMA FIRDS
    - synonym: TechAttrbts.PblctnPrd.FrDtToDt.FrDt
      source: ESMA FIRDS
    - synonym: TechAttrbts.PblctnPrd.Dt
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: date
      vendor: fincommons
    - property: source
      value: >-
        TechAttrbts.PblctnPrd.FrDt | TechAttrbts.PblctnPrd.FrDtToDt.FrDt | TechAttrbts.PblctnPrd.Dt
      vendor: fincommons
  - name: tech_publication_period_to_date
    businessName: Publication period to
    logicalType: date
    physicalType: date
    semanticType: dimension
    description: >-
      Technical attribute: end of the record's publication period in FIRDS, stated
      for records whose publication has ended (terminations).
    synonyms:
    - synonym: TechAttrbts.PblctnPrd.ToDt
      source: ESMA FIRDS
    - synonym: TechAttrbts.PblctnPrd.FrDtToDt.ToDt
      source: ESMA FIRDS
    - synonym: TechAttrbts.PblctnPrd.Dt
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: date
      vendor: fincommons
    - property: source
      value: >-
        TechAttrbts.PblctnPrd.ToDt | TechAttrbts.PblctnPrd.FrDtToDt.ToDt | TechAttrbts.PblctnPrd.Dt
      vendor: fincommons
  - name: tech_relevant_competent_authority
    businessName: Relevant competent authority
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: >-
      Technical attribute: the relevant competent authority for the instrument,
      as a two-letter country code.
    synonyms:
    - synonym: TechAttrbts.RlvntCmptntAuthrty
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: code
      vendor: fincommons
    - property: source
      value: TechAttrbts.RlvntCmptntAuthrty
      vendor: fincommons
  - name: tech_relevant_trading_venue
    businessName: Most relevant trading venue
    logicalType: string
    physicalType: string
    semanticType: dimension
    description: >-
      Technical attribute: MIC of the relevant trading venue, the most relevant
      market in terms of liquidity for the instrument.
    synonyms:
    - synonym: TechAttrbts.RlvntTradgVn
      source: ESMA FIRDS
    customProperties:
    - property: kind
      value: code
      vendor: fincommons
    - property: source
      value: TechAttrbts.RlvntTradgVn
      vendor: fincommons
  - name: valid_from
    businessName: Valid from
    logicalType: date
    physicalType: date
    required: true
    primaryKey: true
    primaryKeyPosition: 3
    semanticType: dimension
    description: >-
      First day the version of the instrument is valid on, taken from the start
      of the publication period as section 4.2 of ESMA65-8-5014 prescribes.
    customProperties:
    - property: kind
      value: date
      vendor: fincommons
    - property: source
      value: derived
      vendor: fincommons
  - name: valid_to
    businessName: Valid to
    logicalType: date
    physicalType: date
    semanticType: dimension
    description: >-
      Last day the version of the instrument is valid on, empty while the version
      is the one in force. A superseded version is closed on the day before the
      version that replaced it begins.
    customProperties:
    - property: kind
      value: date
      vendor: fincommons
    - property: source
      value: derived
      vendor: fincommons
  - name: latest_record
    businessName: Latest record
    logicalType: boolean
    physicalType: boolean
    required: true
    semanticType: dimension
    description: >-
      Whether the version is the most recent one received for its instrument, i.e.
      the latest_record flag of section 4.2 of ESMA65-8-5014. One version of an
      instrument carries it at a time, which is what the first query of section
      4.3 selects on.
    customProperties:
    - property: kind
      value: flag
      vendor: fincommons
    - property: source
      value: derived
      vendor: fincommons
  - name: action_type
    businessName: Action type
    logicalType: string
    physicalType: string
    required: true
    semanticType: dimension
    description: >-
      Action type: the delta-file element a record was reported in, NewRcrd (new),
      ModfdRcrd (modified), TermntdRcrd (terminated) or CancRcrd (cancelled); it
      determines how the record changes the instrument history. FULINS for a version
      read from the full file the history was started from.
    customProperties:
    - property: kind
      value: code
      vendor: fincommons
    - property: source
      value: derived
      vendor: fincommons
