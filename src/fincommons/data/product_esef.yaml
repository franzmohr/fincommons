# The data product of fincommons.financialreport.esef, in the Open Data
# Product Standard. Its output ports name the contracts of the three Silver
# tables by identifier and version; the test suite checks that the contracts
# are shipped in those versions. The order of the ports is the order in which
# the column catalogue takes a column named in several tables: from the
# first. See fincommons.contracts.
apiVersion: v1.1.0
kind: DataProduct
id: fincommons.esef
name: esef
version: 1.0.0
status: active
type: sourceAligned
domain: esef
description:
  purpose: >-
    The annual financial reports that issuers on EU regulated markets file in
    the European Single Electronic Format, as filings.xbrl.org collects them:
    one row per filing, one row per tagged fact, and the issues the data
    quality checks find in them.
outputPorts:
  - name: silver_filings
    type: table
    description: One row per filing the repository lists for the countries collected.
    contractId: fincommons.esef.silver.filings
    version: 1.0.0
  - name: silver_facts
    type: table
    description: One row per fact of the reports collected.
    contractId: fincommons.esef.silver.facts
    version: 1.0.0
  - name: silver_issues
    type: table
    description: One row per issue the data quality checks found in a filing or a fact.
    contractId: fincommons.esef.silver.issues
    version: 1.0.0
